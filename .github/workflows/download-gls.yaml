name: Download video GLS

on:
  workflow_dispatch:
    inputs:
      video_page_url:
        description: 'Full URL to the Sibnet video page (e.g., https://video.sibnet.ru/video5982905-Title)'
        required: true
        type: string
        default: 'https://video.sibnet.ru/video5982905-Garouden_8_VF/'
      file_prefix:
        description: 'Prefix for the saved filename'
        required: true
        type: string
        default: 'gls'
      commit_message:
        description: 'Custom commit message'
        required: false
        type: string
        default: 'Download video (LFS)'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Ensure LFS objects are fetched
        run: |
          git lfs fetch --all
          git lfs checkout

      - name: Extract Direct URL and Download
        id: download_step
        run: |
          PAGE_URL="${{ inputs.video_page_url }}"
          PREFIX="${{ inputs.file_prefix }}"
          DATE_STR=$(date +%Y-%m-%d)
          FILENAME="${PREFIX}-${DATE_STR}.mp4"
          
          # 1. Extract Video ID
          VIDEO_ID=$(echo "$PAGE_URL" | grep -oP 'video\K\d+' | head -n 1)
          if [ -z "$VIDEO_ID" ]; then
            VIDEO_ID=$(echo "$PAGE_URL" | grep -oP 'videoid=\K\d+' | head -n 1)
          fi

          if [ -z "$VIDEO_ID" ]; then
            echo "::error::Could not extract Video ID from URL."
            exit 1
          fi

          # Use the shell.php URL which reliably contains the player config
          SHELL_URL="https://video.sibnet.ru/shell.php?videoid=$VIDEO_ID"
          echo "🌐 Fetching player config from: $SHELL_URL"

          # 2. Fetch with strict headers to prevent 400/403
          # -b "" ensures no cookies are sent which might corrupt the request
          HTML_CONTENT=$(curl -s --fail --location \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.5" \
            -H "Accept-Encoding: gzip, deflate, br" \
            -H "Connection: keep-alive" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H "Sec-Fetch-Dest: document" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-Site: none" \
            -H "Cache-Control: max-age=0" \
            -b "" \
            "$SHELL_URL")

          if [ $? -ne 0 ] || [ -z "$HTML_CONTENT" ]; then
            echo "::error::Failed to fetch video page. Check if the video ID is correct."
            exit 1
          fi

          # 3. Extract Direct MP4 URL
          # Strategy A: Look for 'file' in jwplayer setup (common legacy format)
          DIRECT_URL=$(echo "$HTML_CONTENT" | grep -oP "file['\"]?\s*:\s*['\"]\Khttps?://video\.sibnet\.ru/v/[^'\"]+\.mp4" | head -n 1)
          
          # Strategy B: Look for src in video tag or generic http link to /v/...
          if [ -z "$DIRECT_URL" ]; then
            DIRECT_URL=$(echo "$HTML_CONTENT" | grep -oP "https?://video\.sibnet\.ru/v/[a-zA-Z0-9/]+\.mp4" | head -n 1)
          fi

          # Strategy C: Look for m3u8 and convert to mp4 (sometimes only HLS is listed)
          if [ -z "$DIRECT_URL" ]; then
            M3U8_URL=$(echo "$HTML_CONTENT" | grep -oP "https?://video\.sibnet\.ru/v/[a-zA-Z0-9/]+\.m3u8" | head -n 1)
            if [ -n "$M3U8_URL" ]; then
              DIRECT_URL="${M3U8_URL%.m3u8}.mp4"
            fi
          fi

          if [ -z "$DIRECT_URL" ]; then
            echo "::error::Failed to extract direct video URL."
            echo "--- Debug Content (First 500 chars) ---"
            echo "$HTML_CONTENT" | head -c 500
            exit 1
          fi

          echo "✅ Direct URL found: $DIRECT_URL"
          echo "⬇️ Downloading video..."

          # 4. Download with Referer
          if ! curl -L --fail --location --max-time 180 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: $SHELL_URL" \
            -H "Origin: https://video.sibnet.ru" \
            -b "" \
            -o "$FILENAME" "$DIRECT_URL"; then
            echo "::error::Download failed."
            exit 1
          fi

          # 5. Validation
          echo "🔍 Validating file..."
          FILE_SIZE=$(stat -c%s "$FILENAME")
          echo "File size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 50000 ]; then
            echo "::error::File too small. Likely an error page."
            cat "$FILENAME"
            exit 1
          fi
          
          # Check MP4 Magic Bytes
          HEAD_BYTES=$(xxd -l 4 -p "$FILENAME")
          if [[ "$HEAD_BYTES" != "00000018" && "$HEAD_BYTES" != "00000020" && "$HEAD_BYTES" != "0000001c" ]]; then
             echo "::error::Invalid MP4 magic bytes: $HEAD_BYTES"
             exit 1
          fi
          
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Commit and push video with LFS
        if: success()
        run: |
          FILENAME="${{ steps.download_step.outputs.filename }}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git lfs track "*.mp4"
          git add .gitattributes
          git add "$FILENAME"
          
          if ! git diff --staged --quiet; then
            git commit -m "${{ inputs.commit_message }} - $FILENAME"
            git push
          else
            echo "No changes to commit."
          fi   
