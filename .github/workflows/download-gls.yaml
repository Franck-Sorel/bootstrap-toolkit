name: Download video GLS

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL to the Sibnet video PAGE (e.g., https://video.sibnet.ru/shell.php?videoid=12345)'
        required: true
        type: string
        # Do not put a direct .mp4 link here; put the page URL
        default: 'https://video.sibnet.ru/shell.php?videoid=5982905' 
      file_prefix:
        description: 'Prefix for the saved filename'
        required: true
        type: string
        default: 'gls'
      commit_message:
        description: 'Custom commit message'
        required: false
        type: string
        default: 'Download video (LFS)'
  push: 
    branches:
      -  main

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Ensure LFS objects are fetched
        run: |
          git lfs fetch --all
          git lfs checkout

      - name: Extract Direct URL and Download
        id: download_step
        run: |
          PAGE_URL="${{ inputs.video_url }}"
          PREFIX="${{ inputs.file_prefix }}"
          DATE_STR=$(date +%Y-%m-%d)
          FILENAME="${PREFIX}-${DATE_STR}.mp4"
          
          echo "🌐 Fetching video page to extract direct link..."
          
          # 1. Fetch the page content with a browser User-Agent to avoid blocking
          HTML_CONTENT=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" "$PAGE_URL")
          
          # 2. Extract the direct MP4 URL using regex
          # Looks for src="http://video.sibnet.ru/..." or similar patterns in the player embed code
          DIRECT_URL=$(echo "$HTML_CONTENT" | grep -oP 'src=["\x27]\Khttp[^"\x27]+\.mp4' | head -n 1)
          
          if [ -z "$DIRECT_URL" ]; then
            # Fallback: Try to find 'file' parameter in JS if src tag fails
            DIRECT_URL=$(echo "$HTML_CONTENT" | grep -oP 'file["\x27]\s*:\s*["\x27]\K[^"\x27]+' | head -n 1)
          fi

          if [ -z "$DIRECT_URL" ]; then
            echo "::error::Failed to extract direct video URL. The site structure may have changed or the video is private."
            echo "Debug HTML snippet:"
            echo "$HTML_CONTENT" | head -c 500
            exit 1
          fi

          echo "✅ Direct URL found: $DIRECT_URL"
          echo "⬇️ Downloading video..."

          # 3. Download with User-Agent and Referer to mimic a browser
          if ! curl -L --fail --location --max-time 120 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -e "$PAGE_URL" \
            -o "$FILENAME" "$DIRECT_URL"; then
            echo "::error::Download failed. HTTP Error."
            exit 1
          fi

          # 4. Validation
          echo "🔍 Validating file..."
          FILE_SIZE=$(stat -c%s "$FILENAME")
          FILE_TYPE=$(file -b --mime-type "$FILENAME")
          
          echo "File size: $FILE_SIZE bytes"
          echo "MIME type: $FILE_TYPE"
          
          # Check if file is too small (likely an error message)
          if [ "$FILE_SIZE" -lt 50000 ]; then
            echo "::error::File too small ($FILE_SIZE bytes). Likely an HTTP error page or blocked request."
            cat "$FILENAME"
            exit 1
          fi
          
          # Check MIME type (allow video/mp4 or application/octet-stream if headers are weird but file is valid)
          if [[ "$FILE_TYPE" != "video/mp4" && "$FILE_TYPE" != "application/octet-stream" ]]; then
             # Double check with magic bytes if mime type is ambiguous
             HEAD_BYTES=$(xxd -l 4 -p "$FILENAME")
             if [ "$HEAD_BYTES" != "00000018" ] && [ "$HEAD_BYTES" != "00000020" ]; then # Basic MP4 magic number check
                echo "::error::File is not a valid MP4 (detected: $FILE_TYPE). Download corrupted."
                exit 1
             fi
          fi
          
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Commit and push video with LFS
        if: success()
        run: |
          FILENAME="${{ steps.download_step.outputs.filename }}"
          
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # FIX: Use glob pattern for tracking, not specific filename
          git lfs track "*.mp4"
          git add .gitattributes
          git add "$FILENAME"
          
          echo "📊 LFS Status:"
          git lfs ls-files
          git status
          
          if ! git diff --staged --quiet; then
            git commit -m "${{ inputs.commit_message }} - $FILENAME - $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi   
