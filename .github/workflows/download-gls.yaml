name: Download video GLS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Download video
        run: |
          curl -L --fail \
            'https://dv45-1.sibnet.ru/56/36/44/5636444.mp4?st=X-yFS2vnXvJm97A-bZ5L_A&e=1786236000&stor=45&noip=1' \
            -o video-gls.mp4

      - name: Check video
        run: |
          ls -lh video.mp4
          file video.mp4

      - name: Commit and push video with LFS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # 1. Track the file type (creates/updates .gitattributes)
          git lfs track "*.mp4"
          
          # 2. Add .gitattributes FIRST so Git knows to treat the next file as LFS
          git add .gitattributes
          
          # 3. Add the video file (LFS converts it to a pointer upon add)
          git add video-gls.mp4
          
          # 4. Verify LFS status (optional debug)
          git lfs ls-files
          
          # 5. Commit and Push
          if ! git diff --staged --quiet; then
            git commit -m "Download video (LFS)"
            git push
          else
            echo "No changes to commit."
          fi   
