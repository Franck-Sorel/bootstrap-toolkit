name: Download video

on:
  workflow_dispatch:

permissions:
  contents: write  # Essential for committing and pushing files

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # persist-credentials is true by default, which allows subsequent git commands to auth

      - name: Download video
        run: |
          curl -L --fail \
            'https://dv45-1.sibnet.ru/56/36/44/5636444.mp4?st=X-yFS2vnXvJm97A-bZ5L_A&e=1786236000&stor=45&noip=1' \
            -o video.mp4

      - name: Check video
        run: |
          ls -lh video.mp4
          file video.mp4

      - name: Commit and push video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if git status --porcelain | grep -q "video.mp4"; then
            git add video.mp4
            git commit -m "Download video"
            git push
          else
            echo "No changes to commit."
          fi   
